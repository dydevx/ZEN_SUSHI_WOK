<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEN SUSHI WOK - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background:#000000;
            background-size: cover;
            color: #ffffff;
            overflow-x: hidden;
            max-width: 100vw;
            min-height: 100vh;
        }

        .side-toggle {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.55);
            color: #ffffff;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            z-index: 1200;
        }

        .sidebar {
            position: fixed;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            padding: 30px;
            background: #000000;
            color: #000000;
            transition: 0.4s;
            z-index: 2000;
        }

        .sidebar.active {
            left: 0;
        }

        .close {
            margin-bottom: 20px;
            font-size: 22px;
            cursor: pointer;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            color: #000000;
        }

        .sidebar a {
            display: block;
            margin: 15px 0;
            color: #000000;
            font-weight: 500;
            text-decoration: none;
        }

        .sidebar-social {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .social-title {
            margin-bottom: 15px;
            color: #000000;
            font-size: 14px;
            font-weight: 600;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin: 0;
            border-radius: 50%;
            background: #000000;
            color: #000000;
            font-size: 18px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background: #333;
            color: #000000;
            transform: translateY(-2px);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            display: none;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1500;
        }

        .overlay.active {
            display: block;
        }

        .home-section {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }

        .home-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
            padding: 20px;
        }

        .home-content h1 {
            margin-bottom: 15px;
            color: #ffffff;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.6);
        }

        .home-content h1 span {
            color: #ffffff;
        }

        .home-content p {
            margin: 15px 0 25px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 600px) {
            .home-section {
                min-height: 100vh;
            }

            .home-content h1 {
                font-size: 32px;
            }

            .home-content p {
                font-size: 14px;
            }
        }

        /* Global text color */
        body,
        body *,
        body *::before,
        body *::after {
            color: #ffd700 !important;
        }
    </style>
</head>
<body>
    <button class="side-toggle" type="button" onclick="toggleMenu()" aria-label="Ouvrir le menu">&#9776;</button>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="close" onclick="toggleMenu()">&times;</div>
        <h2>ZEN SUSHI WOK</h2>
        <p>Découvrez notre sélection de sushi et plats asiatiques</p>
        <div class="sidebar-social">
            <div class="social-title">Nous suivre</div>
            <div class="social-icons">
                <a href="https://www.facebook.com/zensushiwok" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/zensushiwok/" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="mailto:zensushiwok06@gmail.com" title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- HOME SECTION -->
    <div class="home-section" id="homeSection">
        <div class="home-content">
            <h1>ZEN SUSHI WOK</h1>
            <p>D&eacute;couvrez notre s&eacute;lection de sushi et plats asiatiques</p>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
